name: Docs

on:
  push:
    paths:
      - docs/**
      - scripts/build-docs.sh
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - scripts/build-docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pandoc/actions/setup@v1
        with:
          version: 3.7.0.2
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.14.2
      - name: Build PDFs
        run: scripts/build-docs.sh
      - name: Check that the committed PDFs are up to date
        run: |
          if ! git diff --exit-code --stat -- docs/*.pdf; then
            echo "::error::docs/*.pdf differ from docs/*.md. Run scripts/build-docs.sh and commit the PDFs."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: labs-pdf
          path: docs/*.pdf
      - name: Publish the PDFs as a release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=labs-pdf
          title="Instrukcje do laboratoriów (PDF)"
          notes="PDF z instrukcją do każdego laboratorium. Aktualizowane automatycznie przy każdej zmianie w docs/."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload "$tag" docs/lab*.pdf --clobber
